<div class="max-w-3xl mx-auto relative h-full flex flex-col justify-center p-3">
  <div class="text-center mb-10">
    <div
      class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary/10 text-primary mb-6 ring-4 ring-primary/5"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight mb-3">
      Vincular Aplicación Móvil
    </h1>
    <p class="text-textMuted max-w-md mx-auto">
      Abre la aplicación móvil de SyncRoutine y escanea este código QR para sincronizar tu sesión
      automáticamente.
    </p>
  </div>

  <!-- Tarjeta Principal -->
  <div
    class="bg-surface border border-white/5 rounded-3xl p-8 sm:p-12 shadow-2xl relative overflow-hidden max-w-md mx-auto w-full"
  >
    <!-- Efecto visual de fondo -->
    <div
      class="absolute -right-20 -top-20 w-40 h-40 bg-primary/10 rounded-full blur-[40px] pointer-events-none"
    ></div>

    <div class="relative z-10 flex flex-col items-center justify-center min-h-[260px]">
      <!-- Estado 1: Cargando -->
      <div *ngIf="isLoading" class="flex flex-col items-center justify-center gap-4">
        <svg class="animate-spin h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24">
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <p class="text-textMuted font-medium animate-pulse">Generando código seguro...</p>
      </div>

      <!-- Estado 2: Código QR Listo -->
      <div
        *ngIf="!isLoading && qrCodeData"
        class="flex flex-col items-center gap-6 w-full animate-fade-in-down"
      >
        <!-- Contenedor con fondo blanco para asegurar que la cámara lea el QR en Modo Oscuro -->
        <div class="bg-white p-3 rounded-2xl shadow-[0_0_20px_rgba(var(--color-primary),0.3)]">
          <qrcode
            [qrdata]="qrCodeData"
            [width]="300"
            [errorCorrectionLevel]="'M'"
            colorDark="#000000"
            colorLight="#FFFFFF"
          >
          </qrcode>
        </div>

        <!-- Mostramos el PIN debajo por estética / respaldo -->
        <div class="bg-background/80 border border-white/10 rounded-xl px-6 py-3 shadow-inner">
          <p class="text-white text-3xl font-black tracking-[0.5em] font-mono text-center ml-2">
            {{ qrCodeData }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón Regresar -->
  <div class="inline-flex items-center justify-center mt-5">
    <a
      routerLink="/bloques"
      class="flex items-center text-textMuted hover:text-white transition-colors cursor-pointer group"
    >
      <svg
        class="w-6 h-6 transform group-hover:-translate-x-1 transition-transform"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        ></path>
      </svg>
      <span class="font-medium text-xl sm:block ml-2">Volver al Inicio</span>
    </a>
  </div>
</div>
