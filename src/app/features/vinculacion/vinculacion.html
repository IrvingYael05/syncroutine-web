<div class="max-w-3xl mx-auto relative h-full flex flex-col justify-center p-3">
  <div class="text-center mb-10">
    <div
      class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary/10 text-primary mb-6 ring-4 ring-primary/5"
    >
      <!-- Ícono de un Reloj Inteligente -->
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="6" y="4" width="12" height="16" rx="3" stroke-width="2"></rect>
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 2h4M10 22h4"
        ></path>
        <circle cx="12" cy="14" r="2" fill="currentColor"></circle>
      </svg>
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight mb-3">
      Vincular Smartwatch
    </h1>
    <p class="text-textMuted max-w-md mx-auto">
      Abre la aplicación SyncRoutine en tu reloj inteligente e ingresa el código de 6 dígitos que
      aparece en pantalla.
    </p>
  </div>

  <div
    class="bg-surface border border-white/5 rounded-3xl p-8 sm:p-12 shadow-2xl relative overflow-hidden max-w-md mx-auto w-full"
  >
    <!-- Efecto visual de fondo -->
    <div
      class="absolute -right-20 -top-20 w-40 h-40 bg-primary/10 rounded-full blur-[40px] pointer-events-none"
    ></div>

    <form [formGroup]="pinForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 relative z-10">
      <div class="flex flex-col gap-3">
        <label class="text-xs font-semibold text-textMuted uppercase tracking-wider text-center"
          >Código de Vinculación</label
        >

        <!-- Input estilo OTP (Números gigantes, centrados, separados) -->
        <input
          type="text"
          formControlName="pin"
          maxlength="6"
          (input)="onInput($event)"
          placeholder="000000"
          autocomplete="off"
          class="w-full bg-background/50 border border-white/10 rounded-2xl px-4 py-5 text-white placeholder:text-white/10 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-center text-4xl font-black tracking-[0.5em] font-mono shadow-inner"
        />

        <!-- Mensaje de Error -->
        <div
          *ngIf="pinForm.get('pin')?.touched && pinForm.get('pin')?.invalid"
          class="text-danger text-sm text-center font-medium mt-1 animate-fade-in-down"
        >
          <span *ngIf="pinForm.get('pin')?.errors?.['required']">El PIN es obligatorio.</span>
          <span *ngIf="pinForm.get('pin')?.errors?.['pattern']"
            >El PIN debe ser exactamente de 6 dígitos.</span
          >
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isSubmitting || pinForm.invalid"
        class="w-full bg-primary hover:bg-primary-hover disabled:bg-primary/30 disabled:text-white/50 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-primary/20 flex justify-center items-center gap-2 text-lg"
      >
        <span *ngIf="!isSubmitting">Vincular Dispositivo</span>

        <div *ngIf="isSubmitting" class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Vinculando...
        </div>
      </button>
    </form>
  </div>
  <div class="inline-flex items-center justify-center mt-5">
    <a
      routerLink="/bloques"
      class="flex items-center text-textMuted hover:text-white transition-colors cursor-pointer"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10 19l-7-7m0 0l7-7m-7 7h18"
        ></path>
      </svg>
      <span class="font-medium text-xl sm:block">Volver al Inicio</span>
    </a>
  </div>
</div>
