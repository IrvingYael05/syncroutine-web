<div class="max-w-7xl mx-auto relative h-full">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
    <div class="flex items-center gap-3">
      <a
        routerLink="/bloques"
        class="flex items-center gap-2 text-textMuted hover:text-white transition-colors cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        <span class="font-medium text-sm hidden sm:block"></span>
      </a>
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Actividades</h1>
        <p class="text-textMuted text-sm mt-0.5">Configura las tareas para: {{ bloqueName }}</p>
      </div>
    </div>

    <button
      (click)="openModal()"
      class="bg-primary hover:bg-primary-hover text-white font-bold py-2.5 px-5 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center gap-2 w-full sm:w-auto justify-center"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4"
        ></path>
      </svg>
      Nueva Tarea
    </button>
  </div>

  <div *ngIf="isLoading" class="flex justify-center items-center py-20">
    <svg class="animate-spin h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
  </div>

  <div
    *ngIf="!isLoading && actividades.length === 0"
    class="bg-surface/50 border border-white/5 border-dashed rounded-3xl p-12 text-center"
  >
    <div class="bg-primary/10 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
        ></path>
      </svg>
    </div>
    <h3 class="text-xl font-bold text-white mb-2">Bloque sin tareas</h3>
    <p class="text-textMuted max-w-sm mx-auto mb-6">
      Agrega los pasos, ejercicios o tareas que realizarás durante este bloque.
    </p>
    <button (click)="openModal()" class="text-primary font-bold hover:underline">
      Agregar primera tarea
    </button>
  </div>

  <div *ngIf="!isLoading && actividades.length > 0" class="flex flex-col gap-3">
    <div
      *ngFor="let actividad of actividades; let i = index"
      class="group bg-surface border border-white/5 rounded-2xl p-4 flex items-center justify-between hover:border-primary/30 transition-colors shadow-md"
    >
      <div class="flex items-center gap-4">
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center text-xl font-bold text-textMuted"
        >
          {{ i + 1 }}.
        </div>

        <div class="flex flex-col">
          <span class="font-bold text-white text-lg leading-tight">{{ actividad.nombre }}</span>
          <span class="text-sm text-primary font-semibold flex items-center gap-1 mt-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            {{ formatTime(actividad.tiempoObjetivoSegundos) }}
          </span>
        </div>
      </div>

      <div class="flex gap-1 sm:gap-2">
        <button
          (click)="openModal(actividad)"
          class="text-textMuted hover:text-danger p-1 transition-colors"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
            ></path>
          </svg>
        </button>
        <button
          (click)="deleteActividad(actividad.id!)"
          class="text-textMuted hover:text-danger p-1 transition-colors"
        >
          <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="isModalOpen" class="fixed inset-0 z-[60] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-background/80 backdrop-blur-sm" (click)="closeModal()"></div>

    <div
      class="bg-surface border border-white/10 rounded-3xl p-6 sm:p-8 w-full max-w-sm relative z-10 shadow-2xl animate-fade-in-down"
    >
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl sm:text-2xl font-bold text-white">
          {{ editingId ? 'Editar Tarea' : 'Nueva Tarea' }}
        </h2>
        <button (click)="closeModal()" class="text-textMuted hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>

      <form [formGroup]="actividadForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-textMuted uppercase tracking-wider"
            >Nombre</label
          >
          <input
            type="text"
            formControlName="nombre"
            placeholder="Ej. Calentamiento, Leer..."
            class="w-full bg-background border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder:text-white/20 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-xs font-semibold text-textMuted uppercase tracking-wider"
            >Tiempo Objetivo</label
          >
          <div class="flex gap-3">
            <div class="flex-1 relative">
              <input
                type="number"
                formControlName="minutos"
                min="0"
                class="w-full bg-background border border-white/10 rounded-xl pl-4 pr-10 py-3.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-center font-mono text-lg"
              />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-textMuted text-sm"
                >min</span
              >
            </div>

            <div class="flex-1 relative">
              <input
                type="number"
                formControlName="segundos"
                min="0"
                max="59"
                class="w-full bg-background border border-white/10 rounded-xl pl-4 pr-10 py-3.5 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-center font-mono text-lg"
              />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-textMuted text-sm"
                >seg</span
              >
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-2 pt-4 border-t border-white/5">
          <button
            type="button"
            (click)="closeModal()"
            class="flex-1 bg-transparent border border-white/10 hover:bg-white/5 text-white font-bold py-3 rounded-xl transition-all"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting"
            class="flex-1 bg-primary hover:bg-primary-hover disabled:bg-primary/50 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-primary/20 flex justify-center items-center gap-2"
          >
            <svg
              *ngIf="isSubmitting"
              class="animate-spin -ml-1 mr-2 h-5 w-5 text-white"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span *ngIf="!isSubmitting">Guardar</span>
            <span *ngIf="isSubmitting">Guardando...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
