<div
  class="flex flex-col items-center justify-center w-full min-h-screen p-6 relative overflow-hidden bg-background"
>
  <!-- ================= ESTADO DE CARGA ================= -->
  <div *ngIf="isLoading" class="flex flex-col items-center">
    <svg class="animate-spin h-10 w-10 text-primary mb-4" fill="none" viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
    <p class="text-textMuted text-sm font-medium">Cargando actividades...</p>
  </div>

  <!-- ================= PANTALLA FINAL (RUTINA COMPLETADA) ================= -->
  <div
    *ngIf="isFinished"
    class="flex flex-col items-center text-center animate-fade-in-down w-full max-w-sm"
  >
    <div
      class="w-24 h-24 sm:w-32 sm:h-32 bg-primary/20 rounded-full flex items-center justify-center mb-6 ring-8 ring-primary/10"
    >
      <svg
        class="w-12 h-12 sm:w-16 sm:h-16 text-primary"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
    </div>
    <h2 class="text-3xl sm:text-4xl font-bold text-white mb-2">¡Completado!</h2>
    <p class="text-textMuted text-sm sm:text-base mb-8">
      Todos tus tiempos han sido registrados en tu historial.
    </p>

    <button
      (click)="finalizarRutina()"
      class="w-full bg-surface border border-white/10 hover:border-primary/50 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95"
    >
      Volver al Inicio
    </button>
  </div>

  <!-- ================= CRONÓMETRO Y ACTIVIDAD ================= -->
  <div
    *ngIf="!isLoading && !isFinished && actividadActual"
    class="w-full max-w-md flex flex-col items-center h-full justify-between animate-fade-in-down py-4"
  >
    <!-- Contador de Actividades -->
    <div class="w-full text-center mb-6">
      <span
        class="bg-surface border border-white/10 text-textMuted text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest"
      >
        Tarea {{ currentIndex + 1 }} de {{ actividades.length }}
      </span>
    </div>

    <!-- Título y Objetivo -->
    <div class="text-center w-full mb-8">
      <h2 class="text-3xl sm:text-5xl font-black text-white leading-tight mb-3 line-clamp-2">
        {{ actividadActual.nombre }}
      </h2>
      <p class="text-primary font-bold text-sm sm:text-base flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        Objetivo: {{ formatTime(actividadActual.tiempoObjetivoSegundos) }}
      </p>
    </div>

    <!-- CRONÓMETRO GIGANTE -->
    <div class="relative flex items-center justify-center w-full my-6">
      <h1
        class="text-7xl sm:text-9xl font-black text-white tracking-tighter font-mono"
        [ngClass]="{ 'text-white': isRunning, 'text-white/50': !isRunning }"
      >
        {{ formatTime(tiempoSegundos) }}
      </h1>
    </div>

    <!-- Controles (Play/Pause y Siguiente) -->
    <div class="flex gap-4 w-full mt-auto pt-6">
      <!-- Botón Pausar / Iniciar -->
      <button
        (click)="toggleTimer()"
        class="flex-1 rounded-3xl flex items-center justify-center py-5 transition-all active:scale-95 shadow-xl"
        [ngClass]="
          isRunning
            ? 'bg-surface border border-white/10 text-white'
            : 'bg-primary text-white shadow-primary/20'
        "
      >
        <svg
          *ngIf="!isRunning"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          class="w-8 h-8"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" />
        </svg>
        <svg
          *ngIf="isRunning"
          class="w-8 h-8"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2.5"
            d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </button>

      <!-- Botón Terminar / Siguiente -->
      <button
        (click)="siguienteActividad()"
        [disabled]="isSaving"
        class="flex-1 bg-danger border border-danger/10 hover:border-danger/30 text-white rounded-3xl flex items-center justify-center py-5 transition-all active:scale-95 group disabled:opacity-50 shadow-danger/20 shadow-xl"
      >
        <svg
          *ngIf="!isSaving"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          class="w-8 h-8"
          fill="currentColor"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5" />
        </svg>
        <svg
          *ngIf="isSaving"
          class="animate-spin h-8 w-8 text-white"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</div>
