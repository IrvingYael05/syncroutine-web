<div
  class="flex flex-col items-center justify-center w-full min-h-screen p-6 text-center relative overflow-hidden"
>
  <!-- ================= BOTÓN CERRAR SESIÓN ================= -->
  <button
    (click)="logout()"
    [disabled]="isLoggingOut"
    class="absolute top-6 right-6 p-3 rounded-full text-textMuted hover:text-danger hover:border-danger/30 hover:bg-danger/10 transition-all active:scale-90 z-50 backdrop-blur-md disabled:opacity-50"
    title="Cerrar Sesión"
  >
    <svg
      *ngIf="!isLoggingOut"
      class="w-5 h-5 sm:w-6 sm:h-6"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
      ></path>
    </svg>
    <svg
      *ngIf="isLoggingOut"
      class="animate-spin h-5 w-5 sm:w-6 sm:h-6 text-danger"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
  </button>
  
  <!-- ================= ENCABEZADO ================= -->
  <div class="mb-10 animate-fade-in-down">
    <div
      class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary/10 text-primary mb-4 ring-4 ring-primary/5"
    >
      <!-- Ícono de lista de tareas -->
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 10h16M4 14h16M4 18h16"
        ></path>
      </svg>
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">Mis Rutinas</h1>
    <p class="text-xs sm:text-sm text-textMuted uppercase tracking-widest mt-2 font-semibold">
      Desliza y selecciona para iniciar
    </p>
  </div>

  <!-- ================= ESTADO DE CARGA ================= -->
  <div *ngIf="isLoading" class="py-10">
    <svg class="animate-spin h-10 w-10 text-primary mx-auto" fill="none" viewBox="0 0 24 24">
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
      ></path>
    </svg>
  </div>

  <!-- ================= ESTADO VACÍO ================= -->
  <div
    *ngIf="!isLoading && bloques.length === 0"
    class="bg-surface/50 border border-white/5 border-dashed rounded-3xl p-8 w-full max-w-sm animate-fade-in-down"
  >
    <p class="text-sm text-textMuted leading-relaxed">
      No tienes bloques creados.<br /><br />Ingresa desde tu celular o PC principal para crear uno.
    </p>
  </div>

  <!-- ================= CARRUSEL (FLASHCARDS) ================= -->
  <div
    *ngIf="!isLoading && bloques.length > 0"
    class="relative w-full max-w-md flex items-center justify-center animate-fade-in-down"
  >
    <!-- Botón Anterior -->
    <button
      *ngIf="currentIndex > 0"
      (click)="prevRoutine()"
      class="absolute left-0 z-10 p-3 sm:p-4 text-textMuted hover:text-white transition-all -ml-2 sm:-ml-6 active:scale-90"
    >
      <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M15 19l-7-7 7-7"
        ></path>
      </svg>
    </button>

    <!-- Tarjeta Principal (Responsive: Cuadrada en móvil/reloj, Rectangular en PC) -->
    <div
      class="w-full aspect-square sm:aspect-[4/3] bg-surface border border-white/10 hover:border-primary/30 rounded-[2rem] flex flex-col items-center justify-center text-center shadow-2xl active:scale-[0.97] transition-all cursor-pointer relative overflow-hidden group p-6 mx-10 sm:mx-12"
      (click)="iniciarBloque(bloques[currentIndex].id!)"
    >
      <!-- Efectos visuales de fondo -->
      <div
        class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent opacity-0 group-active:opacity-100 transition-opacity"
      ></div>
      <div
        class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-[50px] pointer-events-none transition-all group-hover:bg-primary/20"
      ></div>

      <!-- Título de la Rutina -->
      <span class="font-bold text-white text-2xl sm:text-3xl px-2 line-clamp-3 leading-tight">
        {{ bloques[currentIndex].nombre }}
      </span>

      <!-- Etiqueta si la rutina es aleatoria -->
      <span
        *ngIf="bloques[currentIndex].esAleatorio"
        class="mt-4 inline-flex items-center gap-1.5 bg-yellow-500/10 text-yellow-500 text-xs font-bold px-3 py-1.5 rounded-lg border border-yellow-500/20 uppercase"
      >
        Orden Aleatorio
      </span>
    </div>

    <!-- Botón Siguiente -->
    <button
      *ngIf="currentIndex < bloques.length - 1"
      (click)="nextRoutine()"
      class="absolute right-0 z-10 p-3 sm:p-4 text-textMuted hover:text-white transition-all -ml-2 sm:-ml-6 active:scale-90"
    >
      <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2.5"
          d="M9 5l7 7-7 7"
        ></path>
      </svg>
    </button>
  </div>

  <!-- ================= INDICADORES (DOTS) ================= -->
  <div *ngIf="!isLoading && bloques.length > 1" class="flex gap-2.5 mt-10">
    <div
      *ngFor="let b of bloques; let i = index"
      class="h-2.5 rounded-full transition-all duration-300"
      [ngClass]="i === currentIndex ? 'bg-primary w-8' : 'bg-white/20 w-2.5'"
    ></div>
  </div>
</div>
