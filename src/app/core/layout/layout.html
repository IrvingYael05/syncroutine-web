<div
  class="min-h-screen bg-background flex text-textMain selection:bg-primary selection:text-white font-sans"
>
  <!-- ================= BARRA LATERAL (ESCRITORIO) ================= -->
  <aside
    class="hidden md:flex flex-col w-64 bg-surface border-r border-white/5 h-screen sticky top-0"
  >
    <div class="h-20 flex items-center px-6 border-b border-white/5">
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/bloques">
        <svg class="w-7 h-7 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span class="text-xl font-bold tracking-tight">SyncRoutine</span>
      </div>
    </div>
    <nav class="flex-1 p-4 flex flex-col gap-2">
      <a
        routerLink="/bloques"
        routerLinkActive="bg-primary/10 text-primary font-semibold border-primary/20"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:text-white transition-all border border-transparent"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          ></path>
        </svg>
        Creador de Bloques
      </a>
      <a
        routerLink="/historial"
        routerLinkActive="bg-primary/10 text-primary font-semibold border-primary/20"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-textMuted hover:text-white transition-all border border-transparent cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
          ></path>
        </svg>
        Dashboard Histórico
      </a>
    </nav>
  </aside>

  <!-- ================= CONTENIDO PRINCIPAL Y HEADER ================= -->
  <div class="flex-1 flex flex-col min-h-screen">
    <header
      class="h-20 bg-surface md:bg-transparent border-b border-white/5 flex items-center justify-between px-4 sm:px-8 z-40 sticky top-0 backdrop-blur-md"
    >
      <!-- Marca Móvil -->
      <div class="flex md:hidden items-center gap-2">
        <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
        <span class="text-lg font-bold tracking-tight">SyncRoutine</span>
      </div>

      <div class="hidden md:block"></div>

      <!-- Menú de Perfil -->
      <div
        class="relative"
        (touchstart)="isTouch = true"
        (mouseenter)="onProfileMenuEnter()"
        (mouseleave)="onProfileMenuLeave()"
      >
        <button
          (click)="toggleProfileMenu()"
          class="flex items-center gap-3 hover:bg-white/5 p-2 rounded-xl transition-colors cursor-default focus:outline-none"
        >
          <div class="w-25 bg-transparent flex items-center justify-center font-bold text-right">
            {{ userName }}
          </div>
          <div
            class="w-9 h-9 rounded-full bg-primary/20 text-primary flex items-center justify-center font-bold shadow-[0_0_10px_rgba(16,185,129,0.2)]"
          >
            {{ userInitial }}
          </div>
          <svg class="w-4 h-4 text-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            ></path>
          </svg>
        </button>

        <div class="absolute right-0 w-56 pt-2 z-50">
          <div
            *ngIf="isProfileMenuOpen"
            class="bg-surface border border-white/10 rounded-2xl shadow-xl overflow-hidden animate-slide-down origin-top-right"
          >
            <div class="px-4 py-4 border-b border-white/5 bg-background/50">
              <p class="text-xs font-semibold text-textMuted uppercase tracking-wider mb-1">
                Mi Cuenta
              </p>
              <p class="text-sm font-medium text-white truncate" [title]="userEmail">
                {{ userEmail }}
              </p>
            </div>
            <a
              routerLink="/perfil"
              (click)="isProfileMenuOpen = false"
              class="w-full text-left px-4 py-3 text-sm text-textMuted hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors cursor-pointer mt-1"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
              Editar Perfil
            </a>
            <button
              (click)="logout()"
              class="w-full text-left px-4 py-3 text-sm text-danger hover:bg-danger/10 flex items-center gap-2 transition-colors border-t border-white/5 mt-1"
            >
              <span *ngIf="!isLoading">Cerrar Sesión</span>
              <span *ngIf="isLoading">Cerrando Sesión...</span>
              <svg
                *ngIf="!isLoading"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                ></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-8 overflow-y-auto pb-24 md:pb-8">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- ================= BARRA INFERIOR (MÓVIL) ================= -->
  <nav
    class="md:hidden fixed bottom-0 w-full bg-surface border-t border-white/5 px-6 py-3 flex justify-around items-center z-50 pb-safe"
  >
    <a
      routerLink="/bloques"
      routerLinkActive="text-primary"
      class="flex flex-col items-center gap-1 text-textMuted transition-colors"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
        ></path>
      </svg>
      <span class="text-[10px] font-medium">Bloques</span>
    </a>
    <a
      routerLink="/historial"
      routerLinkActive="text-primary"
      class="flex flex-col items-center gap-1 text-textMuted transition-colors"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
        ></path>
      </svg>
      <span class="text-[10px] font-medium">Histórico</span>
    </a>
  </nav>
</div>
